<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152a"><meta property="og:title" content="🪄 霍格華茲傳愛學院｜限時入學邀請"><meta property="og:description" content="魔法入學通道將於 10/10 23:59 關閉。開啟邀請函，完成入學申請。"><title>霍格華茲傳愛學院｜入學邀請</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c19;color:#f9eccc;font-family:Georgia,'Noto Serif TC',serif}.scene{min-height:100svh;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:32px 16px;background:radial-gradient(ellipse at 50% 25%,#34466e 0%,#171f39 38%,#080b16 85%)}.stars{position:absolute;inset:0;background-image:radial-gradient(#ffe9aa 1px,transparent 1.5px),radial-gradient(#fff 1px,transparent 1.5px);background-size:53px 53px,97px 97px;background-position:12px 19px,32px 44px;opacity:.5;animation:twinkle 4s ease-in-out infinite alternate}.moon{position:absolute;width:330px;height:330px;top:5%;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#d4a95826 0%,#d4a95809 46%,transparent 70%)}.card{width:min(100%,520px);position:relative;text-align:center;border:1px solid #d5b87566;border-radius:24px;padding:29px 18px 30px;background:linear-gradient(160deg,#19233bc7,#0d1225dc);box-shadow:0 22px 70px #0008, inset 0 0 65px #f7d88c09;backdrop-filter:blur(5px)}.owl{font-size:42px;animation:float 3s ease-in-out infinite}.overline{font:600 10px Arial,sans-serif;letter-spacing:.3em;color:#d8bb79;margin:14px 0 12px}h1{font-size:clamp(25px,7vw,37px);font-weight:500;line-height:1.3;margin:0;color:#fff4d6}.subtitle{font-size:14px;color:#d2c096;margin:10px 0 25px}.hat{font-size:54px;width:108px;height:108px;margin:0 auto 25px;display:grid;place-items:center;border:1px solid #e7c783aa;border-radius:50%;box-shadow:0 0 0 9px #e7c7831b,0 0 0 19px #e7c7830c,0 0 45px #e7c78320;animation:float 3.6s ease-in-out infinite}.label{font:600 11px Arial,sans-serif;letter-spacing:.19em;color:#e1c381;border-top:1px solid #e7c78344;padding-top:21px}.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:18px 0 20px;border-bottom:1px solid #e7c78344}.number{font-size:clamp(30px,8vw,48px);font-variant-numeric:tabular-nums;color:#ffefc0;text-shadow:0 0 22px #f7c96855}.unit{font:10px Arial,sans-serif;letter-spacing:.1em;color:#a99b7c;margin-top:8px}.deadline{font:600 12px Arial,sans-serif;letter-spacing:.15em;color:#ebcc8a;margin:22px 0 9px}.description{font-size:15px;line-height:1.85;color:#e0d1af;margin:0 0 23px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;width:min(100%,320px);border-radius:40px;background:linear-gradient(120deg,#b99147,#f5db9a,#c39847);color:#22180a;text-decoration:none;font:700 15px Arial,sans-serif;box-shadow:0 8px 30px #dbad5630}.button:focus-visible{outline:3px solid white;outline-offset:4px}.button.disabled{pointer-events:none;opacity:.55}.footer{margin-top:17px;font:10px Arial,sans-serif;letter-spacing:.1em;color:#968971}.spark{position:absolute;bottom:-20px;color:#ffe2a0;animation:rise 7s linear infinite;pointer-events:none}.spark:nth-of-type(1){left:9%}.spark:nth-of-type(2){left:24%;animation-delay:2s}.spark:nth-of-type(3){right:19%;animation-delay:4s}.spark:nth-of-type(4){right:7%;animation-delay:1s}.urgent .number{animation:pulse 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}@keyframes twinkle{to{opacity:.85}}@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-650px);opacity:0}}@keyframes pulse{50%{text-shadow:0 0 28px #f8c35bbb}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="scene"><div class="stars" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div><span class="spark" aria-hidden="true">✦</span><span class="spark" aria-hidden="true">✧</span><span class="spark" aria-hidden="true">✦</span><span class="spark" aria-hidden="true">✧</span><section class="card"><div class="owl" aria-hidden="true">🦉</div><div class="overline">OFFICIAL ENROLLMENT NOTICE</div><h1>霍格華茲傳愛學院</h1><p class="subtitle">愛是最高階的魔法</p><div class="hat" aria-hidden="true">🎩</div><div class="label" id="label">入學通道關閉倒數</div><div class="timer" role="timer" aria-label="距離入學截止的剩餘時間"><div><div class="number" id="days">--</div><div class="unit">DAYS</div></div><div><div class="number" id="hours">--</div><div class="unit">HOURS</div></div><div><div class="number" id="minutes">--</div><div class="unit">MIN</div></div><div><div class="number" id="seconds">--</div><div class="unit">SEC</div></div></div><div class="deadline">10 · 10　23:59　TAIWAN</div><p class="description" id="message">分類帽已經準備好了。<br>請在魔法通道關閉以前，完成你的入學手續。</p><a class="button" id="apply" href="https://forms.gle/EBbKg3MBuXyM2U2q6" target="_blank" rel="noopener noreferrer">✦ 開啟入學申請書 ✦</a><div class="footer" id="footer">THE MAGIC AWAITS · 入學邀請有效中</div></section></main><script>
(()=>{const deadline=Date.parse('2026-10-10T23:59:00+08:00');const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');function update(){const ms=Math.max(0,deadline-Date.now());let s=Math.ceil(ms/1000);$('days').textContent=pad(Math.floor(s/86400));s%=86400;$('hours').textContent=pad(Math.floor(s/3600));s%=3600;$('minutes').textContent=pad(Math.floor(s/60));$('seconds').textContent=pad(s%60);if(ms===0){$('label').textContent='ENROLLMENT CLOSED · 入學通道已關閉';$('message').innerHTML='本次魔法入學申請已結束。<br>期待下一次魔法相遇。';$('apply').classList.add('disabled');$('apply').removeAttribute('href');$('apply').textContent='✦ 入學通道已關閉 ✦';$('footer').textContent='THE GATE IS CLOSED';}else if(ms<=3600000){document.body.classList.add('urgent');$('label').textContent='FINAL HOUR · 最後入學時刻';}else if(ms<=86400000){document.body.classList.add('urgent');$('label').textContent='FINAL 24 HOURS · 最後倒數';}}update();setInterval(update,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});})();
</script></body></html>
